name: Claude Code Review

on:
  pull_request:
    types: [opened, ready_for_review]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            この Pull Request の変更内容をレビューしてください。
            PR ブランチは現在の作業ディレクトリにチェックアウト済みです。

            レビュー方針・評価レベル(🔴 CRITICAL / 🟡 WARNING / 🔵 INFO)・
            マージ判定・指摘しない対象は、CLAUDE.md の「レビュー方針」に従ってください。

            指摘は mcp__github_inline_comment__create_inline_comment で該当行に
            インラインコメントとして投稿してください。各コメントの本文は先頭に
            評価レベルのラベルを置いてください。ラベルを付けられない指摘は投稿しないでください。

            サマリーコメントは投稿不要です。集計と判定は後続のワークフローステップが行います。
          claude_args: >-
            --allowedTools "Read,Grep,Glob,LS,Bash(gh pr diff:*),Bash(gh pr view:*),mcp__github_inline_comment__create_inline_comment"
            --append-system-prompt "レビューコメントとサマリーはすべて日本語で書いてください。"
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

      - name: 実行ログをアーティファクトに保存
        if: always()
        env:
          EXECUTION_FILE: ${{ steps.claude-review.outputs.execution_file }}
          CONCLUSION: ${{ steps.claude-review.outputs.conclusion }}
        run: |
          # outputs が空かどうかは、レビューが実際に走ったかの判定条件の候補。
          # 実測値を残すために、値そのものをログに出す。
          echo "conclusion=[${CONCLUSION}]"
          echo "execution_file=[${EXECUTION_FILE}]"

          if [ -n "$EXECUTION_FILE" ] && [ -f "$EXECUTION_FILE" ]; then
            cp "$EXECUTION_FILE" claude-execution-output.json
          else
            echo '{"note":"execution_file is empty or missing"}' > claude-execution-output.json
          fi

      - name: 実行ログをアップロード
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: claude-execution-output-${{ github.event.pull_request.number }}
          path: claude-execution-output.json
          retention-days: 7

      - name: レビュー結果を集計して判定を投稿
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          OUTCOME: ${{ steps.claude-review.outcome }}
          EXECUTION_FILE: ${{ steps.claude-review.outputs.execution_file }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail

          gh api --paginate "repos/$GH_REPO/pulls/$PR_NUMBER/comments" \
            --jq '.[] | select(.user.login == "claude[bot]") | .body
                  | if test("CRITICAL") then "CRITICAL"
                    elif test("WARNING") then "WARNING"
                    elif test("INFO") then "INFO"
                    else "UNLABELED" end' > labels.txt || : > labels.txt

          count() { grep -cxF "$1" labels.txt || true; }
          CRITICAL=$(count CRITICAL)
          WARNING=$(count WARNING)
          INFO=$(count INFO)
          UNLABELED=$(count UNLABELED)

          # レビューが実際に走ったかは outcome では判定できない。ワークフローファイルが
          # default branch と不一致だと claude-code-action は警告を出して exit 0 するため、
          # outcome は success のままになる。実行された場合のみ outputs が埋まる。
          DENIALS=$(jq -r '[.[]? | select(.type == "result") | .permission_denials_count] | last // 0' \
            claude-execution-output.json 2>/dev/null || echo 0)

          # レビューが走らなかった場合、件数はすべて0になるが「指摘0件」を意味しない。
          # 誤読を避けるため、その場合は集計表と内訳の案内を出さない。
          REVIEWED=true
          if [ "$OUTCOME" != "success" ]; then
            REVIEWED=false
            VERDICT="⚠️ **判定不能** — レビューステップが正常終了しませんでした(ステップの結果: \`$OUTCOME\`)。"
          elif [ -z "$EXECUTION_FILE" ]; then
            REVIEWED=false
            VERDICT="⚠️ **判定不能** — レビューが実行されていません。ワークフローファイルが default branch と一致しない PR は workflow validation でスキップされます。ワークフローを変更した PR か、変更前に切られたブランチの場合は main に追従させてください。"
          elif [ "$CRITICAL" -gt 0 ]; then
            VERDICT="❌ **マージ要件を満たしていません** — CRITICAL が ${CRITICAL} 件あります。"
          else
            VERDICT="✅ **マージ要件を満たしています** — CRITICAL は 0 件です。"
          fi

          {
            echo "## Claude Code Review"
            echo
            echo "$VERDICT"

            if [ "$REVIEWED" = true ]; then
              echo
              echo "| レベル | 件数 |"
              echo "| --- | --- |"
              echo "| 🔴 CRITICAL | ${CRITICAL} |"
              echo "| 🟡 WARNING | ${WARNING} |"
              echo "| 🔵 INFO | ${INFO} |"
              if [ "$UNLABELED" -gt 0 ]; then
                echo "| ラベルなし | ${UNLABELED} |"
              fi

              if [ "$DENIALS" -gt 0 ]; then
                echo
                echo "> ⚠️ レビュー中に ${DENIALS} 件の権限拒否が発生しました。許可ツールの設定が不足している可能性があり、"
                echo "> 上記の件数は実際の指摘数より少ない可能性があります。実行ログのアーティファクトを確認してください。"
              fi

              echo
              echo "内訳は各インラインコメントを参照。"
            fi

            echo
            echo "[実行ログ]($RUN_URL)"
          } > body.md

          gh pr comment "$PR_NUMBER" --body-file body.md
